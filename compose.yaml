name: orangehrm-qa
services:
  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}
      MYSQL_ROOT_HOST: '%'
    ports: ['127.0.0.1:3307:3306']
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u root --execute="SELECT 1" >/dev/null']
      start_period: 120s
      interval: 5s
      timeout: 5s
      retries: 60
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
    depends_on:
      mysql: {condition: service_healthy}
    ports: ['127.0.0.1:8080:80']
    volumes: [app_data:/var/www/html]
  hub:
    image: selenium/hub:4.27.0-20241204
    ports: ['127.0.0.1:4444:4444']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4444/status | grep -q "\"ready\": true"']
      interval: 5s
      timeout: 5s
      retries: 60
  chrome:
    image: selenium/node-chrome:4.27.0-20241204
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
    depends_on: [hub]
    extra_hosts: ['host.docker.internal:host-gateway']
  firefox:
    image: selenium/node-firefox:4.27.0-20241204
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      # This lab requests headless Firefox; avoid an unused desktop and VNC stack.
      SE_START_XVFB: 'false'
      SE_START_VNC: 'false'
      SE_START_NO_VNC: 'false'
      # No OpenTelemetry collector is provisioned in this local lab.
      SE_ENABLE_TRACING: 'false'
    depends_on: [hub]
    extra_hosts: ['host.docker.internal:host-gateway']
  jenkins:
    image: jenkins/jenkins:2.479.2-jdk17
    profiles: [jenkins]
    ports: ['127.0.0.1:8081:8080']
    volumes: [jenkins_data:/var/jenkins_home]
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports: ['127.0.0.1:8025:8025']
volumes:
  mysql_data:
  app_data:
  jenkins_data:
